<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - Budget Tracker</title>
</head>
<body>
    <h2>Enter Verification Code</h2>
    <p>An OTP was generated for: <strong>{{ phone }}</strong></p>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="/verify-otp" method="POST">
        <input type="hidden" name="phone" value="{{ phone }}">
        <label for="otp">Enter 6-Digit OTP:</label><br>
        <input type="text" id="otp" name="otp" maxlength="6" required><br><br>
        <button type="submit">Verify & Log In</button>
    </form>
    <br>
    <a href="/login">Change Phone Number</a>
</body>
</html>
