<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget Detail - Budget Tracker</title>
</head>
<body>
    <h2>Budget Details</h2>
    <p>Logged in as: <strong>{{ phone }}</strong></p>
    <a href="/dashboard">Back to Dashboard</a> | <a href="/logout">Log Out</a>
    
    <hr>

    <h3>{{ budget.title }}</h3>
    <p><strong>ID:</strong> {{ budget.id }}</p>
    <p><strong>Allocated Amount:</strong> ${{ "%.2f"|format(budget.amount) }}</p>
</body>
</html>
