<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget Tracker</title>
</head>
<body>
    <h2>Budget Tracker</h2>
    
    <hr>

    <h3>Add New Budget Entry</h3>
    <form action="/add-budget" method="POST">
        <input type="text" name="title" placeholder="Budget Title" required>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
        <button type="submit">Add Budget</button>
    </form>

    <hr>

    <h3>All Budgets</h3>
    {% if budgets %}
        <ul>
        {% for b in budgets %}
            <li>
                <strong>{{ b.title }}</strong>: ${{ "%.2f"|format(b.amount) }}
                - <a href="/detail/{{ b.id }}">View Details</a>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No budget records found. Add one above!</p>
    {% endif %}
</body>
</html>
