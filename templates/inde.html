<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Budget Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .hero-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; max-width: 450px; width: 90%; }
        h1 { font-size: 28px; color: #2c3e50; margin-bottom: 15px; }
        p { color: #7f8c8d; margin-bottom: 25px; line-height: 1.5; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn { text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; transition: all 0.2s ease; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #ecf0f1; color: #2c3e50; }
        .btn-secondary:hover { background-color: #bdc3c7; }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1>Budget Tracker</h1>
        <p>Take control of your personal finances. Track daily expenses and manage your allocations seamlessly.</p>
        <div class="btn-group">
            <a href="/login" class="btn btn-primary">Go to Login</a>
            <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>
</body>
</html>
